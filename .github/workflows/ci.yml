name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install and import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries Qt needs to start headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Tetia (not editable, like a user would)
        run: python -m pip install .
      - name: Import every model and find the packaged QML
        # Run from outside the checkout so the installed package is the one tested.
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from tetia import __main__ as app
          app._register_qml_types()          # imports every model, registering its QML type
          qml = app.qml_main_file()
          assert qml.is_file(), qml
          assert len(list(qml.parent.rglob("*.qml"))) >= 9, "QML files missing from the package"
          print("ok:", qml)
          PY

  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs to start headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs to start headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install PySide6
      # Kirigami is not installed here, so imports of it are reported as warnings
      # (exit code 0); a syntax error in a .qml file fails the job.
      - name: qmllint
        run: pyside6-qmllint src/tetia/qml/main.qml src/tetia/qml/views/*.qml
